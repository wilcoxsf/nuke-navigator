<!doctype html>
<html lang="en">
  <head>
    <script>
      // one canonical version (30 Oct, Andrew: "we only need like one canonical version that actually shows up"; 31 Oct: "You can kill literally every old version"):
      // every address opens Study 25, keeping whatever else it carries (the friends' ?t= token, show=reel)
      ;(() => { const q = new URLSearchParams(location.search); if (q.get('mode') === 'dojo' && q.get('cp') === '25') return; q.set('mode', 'dojo'); if (!q.has('ui')) q.set('ui', 'K'); q.set('cp', '25'); for (const k of ['real', 'look', 'legacy']) q.delete(k); location.replace(location.pathname + '?' + q + location.hash) })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Nuke Navigator</title>

    <style>
      html, body { margin: 0; height: 100%; background: #ffe2a6; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
